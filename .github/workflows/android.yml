name: Android APK
on:
  push:
    branches: ['feature/android-offline-reports']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Build signed release APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run android:sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Verify debug APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoiSmety-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Restore release signing key
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moismety-release.jks"
      - name: Build signed release
        if: ${{ inputs.release }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/moismety-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Verify release APK
        if: ${{ inputs.release }}
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release }}
        with:
          name: MoiSmety-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/moismety-release.jks"
